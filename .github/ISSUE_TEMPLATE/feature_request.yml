name: Idea or improvement
description: Suggest something that would make the world more enjoyable.
title: "[Idea] "
body:
  - type: textarea
    id: experience
    attributes:
      label: What player experience would this improve?
      description: Describe the place, activity or problem you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: Images, sketches and small examples are welcome; credit their sources.
    validations:
      required: true
