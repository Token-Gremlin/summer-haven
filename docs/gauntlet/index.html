<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summer Haven · World workshop</title>
<style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#e9ecdf;background:#132320;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:48px 28px 80px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid #41544a;padding-bottom:30px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#b6ccaa;text-transform:uppercase}h1{font:normal clamp(32px,5vw,54px) Georgia,serif;margin:12px 0;color:#fff5d8}h2{font:normal 25px Georgia,serif;margin:35px 0 17px}p{line-height:1.6;color:#bac9c0}a{color:#e2cc8d;text-decoration:none}a:hover{text-decoration:underline}.button{display:inline-block;background:#d9deb4;color:#20362b;padding:12px 17px;border-radius:6px;margin:8px 8px 0 0;font-size:13px}.secondary{background:#344b3f;color:#d9deb4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;border:1px solid #384e42;background:#1a2d26;border-radius:9px}.card h3{font-size:16px;font-weight:500;margin:4px 0 12px}.card p{font-size:13px;margin:10px 0 0}.pill{font-size:10px;text-transform:uppercase;letter-spacing:.08em;border:1px solid #6d7851;border-radius:18px;padding:5px 8px;color:#d5d8ad;display:inline-block}.metric{font:normal 25px Georgia,serif;color:#ede6c7;margin:8px 0}.row{padding:16px 0;border-top:1px solid #344c40;display:grid;grid-template-columns:240px 1fr;gap:20px;font-size:14px}.row p{margin:0}.note{border-left:3px solid #b9a361;padding:14px 20px;background:#263a2e}.muted{font-size:12px;color:#8fa699}footer{margin-top:35px;font-size:12px;color:#91a995}.hero{margin-bottom:25px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #344c40}th{font-weight:500;color:#d9deb4}.comparison{padding:0;overflow:hidden}.comparison img{width:100%;aspect-ratio:1.38;object-fit:cover;display:block}.comparison .caption{padding:18px}.comparison .links{font-size:12px;margin-top:12px} @media(max-width:760px){header{display:block}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:7px}}
</style>
</head>
<body><main id="workshop"><p>Opening the workshop log…</p></main>
<script type="module">
const d=await (await fetch('./progress.json',{cache:'no-store'})).json();
const e=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const performance=d.performance ? `
  <h2>Current sustained measurements</h2>
  <p>${e(d.performance.hardware)}<br>${e(d.performance.configuration)}</p>
  <div class="table-wrap"><table><thead><tr><th>Moving scene</th><th>FPS across runs</th><th>95th percentile frame time</th><th>Long frames & limits</th></tr></thead>
  <tbody>${d.performance.scenes.map(s=>`<tr><td>${e(s.name)}</td><td>${e(s.fps)}</td><td>${e(s.p95)}</td><td>${e(s.note)}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">${e(d.performance.verdict)}</p>
  <p class="muted">${e(d.performance.memory)} <a href="${e(d.performance.file)}">Raw samples and method ↗</a></p>` : '';
const comparisons=(d.comparisons??[]).length ? `
  <h2>Actual comparison evidence</h2>
  <p class="muted">Identity was revealed after independent preferences. A preferred still is not approval of animation, atmosphere or the complete world.</p>
  <div class="grid">${d.comparisons.map(c=>`<article class="card comparison"><a href="${e(c.image)}"><img src="${e(c.image)}" alt="${e(c.alt)}" loading="lazy"></a><div class="caption"><h3>${e(c.title)}</h3><p>${e(c.result)}</p><div class="links"><a href="${e(c.before)}">Earlier candidate</a> · <a href="${e(c.after)}">Later candidate</a> · <a href="${e(c.review)}">Independent decision</a></div></div></article>`).join('')}</div>` : '';
document.querySelector('#workshop').innerHTML=`
<header><div><div class="eyebrow">Summer Haven / Production journal</div><h1>A world worth wandering.</h1><div class="muted">${e(d.phase)} · ${e(d.branch)}</div></div><div><span class="pill">Goal active · Not complete</span><p class="muted">Updated ${e(d.updated)}</p></div></header>
<section class="hero"><p>${e(d.playable.note)}</p><a class="button" href="${e(d.playable.approved)}" target="_blank">Play approved village ↗</a><a class="button secondary" href="${e(d.playable.development)}" target="_blank">Open development build ↗</a><a class="button secondary" href="OBJECTIVE.txt">Full objective</a></section>
<h2>World & system coverage</h2><div class="grid">${d.coverage.map(c=>`<article class="card"><h3>${e(c.name)}</h3><span class="pill">${e(c.state)}</span><p>${e(c.gap)}</p></article>`).join('')}</div>
${performance}
<h2>Historical starting point</h2><p>${e(d.baseline.hardware)}<br>${e(d.baseline.viewport)} · ${e(d.baseline.render)}</p><div class="grid">${['town','river','interior'].map(k=>`<div class="card"><div class="eyebrow">${e(k)}</div><div class="metric">${e(d.baseline[k])}</div></div>`).join('')}</div><p class="muted">${e(d.baseline.heap)}. ${e(d.baseline.note)}</p>
${comparisons}
<h2>Independent review & evidence</h2>${d.reviews.map(r=>`<div class="row"><a href="${e(r.file)}">${e(r.title)} ↗</a><p>${e(r.status)}</p></div>`).join('')}
<h2>Validation</h2>${d.tests.map(t=>`<div class="row"><a href="${e(t.file)}">${e(t.name)} ↗</a><p>${e(t.result)}</p></div>`).join('')}
<h2>Next experiment</h2><p class="note">${e(d.next)}</p>
<footer>${e(d.constraints)}<br>Preserved playable checkpoint: ${e(d.playable.checkpoint)}</footer>`;
</script></body></html>
